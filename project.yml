name: LitterBox
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.litterboxtracker
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LitterBox:
    type: application
    platform: iOS
    sources: [LitterBox, Shared]
    dependencies:
      - target: LitterBoxWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LitterBox/LitterBox.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LitterBox AppStore
    info:
      path: LitterBox/Info.plist
      properties:
        CFBundleDisplayName: Litter Box Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APP_STORE_ID: $(APP_STORE_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.litterboxtracker
            CFBundleURLSchemes: [litterboxtracker]
  LitterBoxWidget:
    type: app-extension
    platform: iOS
    sources:
      - LitterBoxWidget
      - Shared/WidgetSnapshot.swift
      - Shared/L10n.swift
      - Shared/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: LitterBoxWidget/LitterBoxWidget.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LitterBox Widget AppStore
    info:
      path: LitterBoxWidget/Info.plist
      properties:
        CFBundleDisplayName: Litter Box Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LitterBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LitterBoxTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  LitterBoxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LitterBoxUITests]
    dependencies:
      - target: LitterBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LitterBox
schemes:
  LitterBox:
    build:
      targets:
        LitterBox: all
        LitterBoxTests: [test]
    test:
      config: Debug
      targets: [LitterBoxTests]
  LitterBoxUI:
    build:
      targets:
        LitterBox: all
        LitterBoxUITests: [test]
    test:
      config: Debug
      targets: [LitterBoxUITests]
